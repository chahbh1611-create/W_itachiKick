<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>W_Itachi | Links</title>

<style>
:root{
    --bg:#030304;
    --red:#c91622;
    --red2:#ff3340;
    --text:#f5f5f5;
    --muted:#85858d;
    --glass:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.09);
    --ease:cubic-bezier(.2,.8,.2,1);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,"Segoe UI",sans-serif;
}

button,
a{
    font:inherit;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ================================
   BACKGROUND
================================ */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(130,0,10,.18),
            transparent 32%
        ),
        #030304;
}

.background::before{
    content:"";
    position:absolute;
    inset:-20%;
    background:
        radial-gradient(
            circle,
            rgba(190,15,25,.07) 1px,
            transparent 1.5px
        );
    background-size:42px 42px;
    animation:particles 30s linear infinite;
    opacity:.55;
}

.background::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.7) 100%
        );
}

/* ================================
   RED MOON
================================ */

.moon{
    position:absolute;
    top:-100px;
    left:50%;
    width:380px;
    height:380px;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 32%,
            #ff5660,
            #a70d17 48%,
            #450308 75%,
            transparent 76%
        );
    filter:blur(.2px);
    opacity:.18;
    box-shadow:
        0 0 80px rgba(210,15,28,.22),
        0 0 180px rgba(180,0,15,.08);
    animation:moonFloat 8s ease-in-out infinite;
}

/* ================================
   SHARINGAN
================================ */

.sharingan{
    position:absolute;
    top:85px;
    left:50%;
    width:190px;
    height:190px;
    transform:translateX(-50%);
    border-radius:50%;
    opacity:.045;
    border:2px solid #ff1827;
    animation:sharinganSpin 18s linear infinite;
}

.sharingan::before,
.sharingan::after{
    content:"";
    position:absolute;
    inset:16px;
    border-radius:50%;
    border:1px solid #ff1827;
}

.sharingan::after{
    inset:70px;
    background:#ff1827;
    border:none;
    box-shadow:
        0 0 30px #ff1827;
}

/* ================================
   INTRO
================================ */

.intro{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#020203;
    transition:
        opacity 1s var(--ease),
        visibility 1s;
}

.intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-inner{
    text-align:center;
}

.intro-eye{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    border:1px solid rgba(255,40,50,.4);
    box-shadow:
        0 0 40px rgba(200,10,25,.15);
    display:grid;
    place-items:center;
    animation:introEye 1.7s var(--ease);
}

.intro-eye::before{
    content:"";
    width:18px;
    height:18px;
    border-radius:50%;
    background:#d71826;
    box-shadow:0 0 25px #d71826;
}

.intro-name{
    margin-top:20px;
    font-size:15px;
    font-weight:900;
    letter-spacing:5px;
    opacity:0;
    animation:
        fadeUp .8s .35s forwards var(--ease);
}

.intro-line{
    width:100px;
    height:1px;
    margin:15px auto 0;
    background:linear-gradient(
        90deg,
        transparent,
        #d71826,
        transparent
    );
    transform:scaleX(0);
    animation:
        lineIn 1s .55s forwards var(--ease);
}

/* ================================
   PAGE
================================ */

.page{
    width:min(560px,calc(100% - 30px));
    margin:auto;
    padding:65px 0 35px;
}

/* ================================
   PROFILE
================================ */

.profile{
    text-align:center;
    animation:profileIn 1s .2s both var(--ease);
}

.logo-wrap{
    position:relative;
    width:105px;
    height:105px;
    margin:auto;
}

.logo-wrap::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px solid rgba(220,20,35,.28);
    animation:ringPulse 3s ease-in-out infinite;
}

.logo-wrap::after{
    content:"";
    position:absolute;
    inset:-17px;
    border-radius:50%;
    border:1px dashed rgba(220,20,35,.12);
    animation:ringSpin 20s linear infinite;
}

.logo{
    position:relative;
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.1);
    background:#101012;
    box-shadow:
        0 15px 50px rgba(0,0,0,.55),
        0 0 45px rgba(200,10,25,.14);
}

.profile h1{
    margin-top:24px;
    font-size:25px;
    font-weight:1000;
    letter-spacing:-.7px;
}

.verified{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:17px;
    height:17px;
    margin-right:5px;
    border-radius:50%;
    background:#d51a27;
    color:white;
    font-size:10px;
    vertical-align:2px;
}

.bio{
    margin:9px auto 0;
    max-width:430px;
    color:var(--muted);
    font-size:12px;
    line-height:1.7;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:14px;
    padding:6px 10px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:99px;
    background:rgba(255,255,255,.025);
    color:#a5a5ad;
    font-size:9px;
    font-weight:800;
}

.status-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#35d889;
    box-shadow:0 0 12px rgba(53,216,137,.6);
}

/* ================================
   LINKS
================================ */

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:32px;
}

.link{
    position:relative;
    min-height:62px;
    display:flex;
    align-items:center;
    padding:8px 10px 8px 18px;
    border:1px solid var(--border);
    border-radius:16px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.025)
        );
    box-shadow:
        0 10px 35px rgba(0,0,0,.18);
    overflow:hidden;
    transition:
        transform .35s var(--ease),
        border-color .35s ease,
        background .35s ease,
        box-shadow .35s ease;
    animation:linkIn .75s both var(--ease);
}

.link:nth-child(1){animation-delay:.35s}
.link:nth-child(2){animation-delay:.43s}
.link:nth-child(3){animation-delay:.51s}
.link:nth-child(4){animation-delay:.59s}
.link:nth-child(5){animation-delay:.67s}
.link:nth-child(6){animation-delay:.75s}

.link::before{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    right:0;
    width:3px;
    background:linear-gradient(
        #ff3946,
        #8e0912
    );
    transform:scaleY(0);
    transform-origin:center;
    transition:transform .35s var(--ease);
}

.link::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    top:50%;
    left:-100px;
    transform:translateY(-50%);
    border-radius:50%;
    background:rgba(220,15,30,.12);
    filter:blur(35px);
    opacity:0;
    transition:opacity .35s ease;
}

.link:hover{
    transform:
        translateY(-4px)
        scale(1.008);
    border-color:
        rgba(255,255,255,.15);
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.035)
        );
    box-shadow:
        0 18px 45px rgba(0,0,0,.28),
        0 0 30px rgba(170,10,20,.05);
}

.link:hover::before{
    transform:scaleY(1);
}

.link:hover::after{
    opacity:1;
}

.link:active{
    transform:scale(.98);
}

.icon{
    position:relative;
    z-index:2;
    width:43px;
    height:43px;
    flex:0 0 43px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.07);
    font-size:16px;
    transition:
        transform .35s var(--ease),
        background .35s ease;
}

.link:hover .icon{
    transform:rotate(-4deg) scale(1.05);
    background:rgba(200,15,28,.13);
}

.link-text{
    position:relative;
    z-index:2;
    flex:1;
    text-align:center;
    padding:0 10px;
}

.link-title{
    font-size:12px;
    font-weight:900;
}

.link-sub{
    margin-top:3px;
    color:#6f6f77;
    font-size:8px;
    font-weight:700;
}

.arrow{
    position:relative;
    z-index:2;
    width:30px;
    color:#67676f;
    font-size:14px;
    text-align:center;
    transition:
        transform .35s var(--ease),
        color .35s ease;
}

.link:hover .arrow{
    color:white;
    transform:translateX(-3px);
}

/* ================================
   SPECIAL LIVE BUTTON
================================ */

.link.live{
    border-color:rgba(210,20,32,.2);
    background:
        linear-gradient(
            135deg,
            rgba(170,10,20,.12),
            rgba(255,255,255,.035)
        );
}

.live .icon{
    background:rgba(200,15,27,.16);
}

.live-dot{
    position:absolute;
    top:9px;
    left:11px;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#e4212e;
    box-shadow:0 0 12px #e4212e;
    animation:pulse 1.5s infinite;
}

/* ================================
   SOCIALS
================================ */

.socials{
    display:flex;
    justify-content:center;
    gap:9px;
    margin-top:22px;
    animation:fadeUp .8s .9s both var(--ease);
}

.social{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    color:#9a9aa1;
    font-size:12px;
    transition:
        transform .3s var(--ease),
        color .3s ease,
        background .3s ease,
        border-color .3s ease;
}

.social:hover{
    transform:translateY(-4px);
    color:white;
    background:rgba(200,15,28,.1);
    border-color:rgba(220,25,38,.25);
}

/* ================================
   FOOTER
================================ */

.footer{
    margin-top:35px;
    text-align:center;
    color:#4e4e55;
    font-size:8px;
    letter-spacing:.7px;
    animation:fadeUp .8s 1s both var(--ease);
}

.footer span{
    color:#77777e;
}

/* ================================
   CROWS / PARTICLES
================================ */

.crow{
    position:fixed;
    z-index:-1;
    width:22px;
    height:10px;
    opacity:0;
    pointer-events:none;
}

.crow::before,
.crow::after{
    content:"";
    position:absolute;
    width:14px;
    height:7px;
    top:0;
    background:#09090b;
    border-radius:100% 0 100% 0;
}

.crow::before{
    left:0;
    transform:rotate(18deg);
}

.crow::after{
    right:0;
    transform:rotate(-18deg);
}

.crow.one{
    top:31%;
    left:-30px;
    animation:crowFly 13s linear 2s infinite;
}

.crow.two{
    top:58%;
    left:-30px;
    transform:scale(.65);
    animation:crowFly 17s linear 7s infinite;
}

.crow.three{
    top:73%;
    left:-30px;
    transform:scale(.45);
    animation:crowFly 20s linear 11s infinite;
}

/* ================================
   KEYFRAMES
================================ */

@keyframes particles{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(42px);
    }
}

@keyframes moonFloat{
    0%,100%{
        transform:translateX(-50%) translateY(0);
    }
    50%{
        transform:translateX(-50%) translateY(12px);
    }
}

@keyframes sharinganSpin{
    from{
        transform:translateX(-50%) rotate(0);
    }
    to{
        transform:translateX(-50%) rotate(360deg);
    }
}

@keyframes introEye{
    0%{
        opacity:0;
        transform:scale(.4) rotate(-20deg);
    }
    70%{
        opacity:1;
        transform:scale(1.08) rotate(5deg);
    }
    100%{
        transform:scale(1) rotate(0);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes lineIn{
    to{
        transform:scaleX(1);
    }
}

@keyframes profileIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes linkIn{
    from{
        opacity:0;
        transform:translateY(22px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.5;
    }
    50%{
        transform:scale(1.07);
        opacity:.9;
    }
}

@keyframes ringSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
        opacity:1;
    }
    50%{
        transform:scale(.65);
        opacity:.5;
    }
}

@keyframes crowFly{
    0%{
        left:-40px;
        opacity:0;
        transform:translateY(20px) scale(.8);
    }
    8%{
        opacity:.28;
    }
    45%{
        opacity:.16;
    }
    90%{
        opacity:.05;
    }
    100%{
        left:110%;
        opacity:0;
        transform:translateY(-35px) scale(.8);
    }
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .page{
        width:min(
            100% - 22px,
            500px
        );
        padding-top:48px;
    }

    .moon{
        width:280px;
        height:280px;
        top:-70px;
    }

    .sharingan{
        top:65px;
        width:145px;
        height:145px;
    }

    .logo-wrap{
        width:92px;
        height:92px;
    }

    .profile h1{
        font-size:22px;
    }

    .bio{
        font-size:11px;
        padding:0 10px;
    }

    .link{
        min-height:59px;
        border-radius:15px;
    }

    .icon{
        width:40px;
        height:40px;
        flex-basis:40px;
    }

    .link-title{
        font-size:11px;
    }

    .link-sub{
        font-size:7px;
    }

    .social{
        width:36px;
        height:36px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        scroll-behavior:auto!important;
    }
}
</style>
</head>

<script>

/* =========================================
   INTRO
========================================= */

window.addEventListener("load",()=>{

    const intro =
        document.getElementById("intro");

    setTimeout(()=>{

        intro.classList.add("hide");

    },1500);

});


/* =========================================
   3D TILT ON LINKS
   רק במחשב
========================================= */

const links =
    document.querySelectorAll(".link");

if(
    window.matchMedia("(pointer:fine)").matches
){

    links.forEach(link=>{

        link.addEventListener(
            "mousemove",
            event=>{

                const rect =
                    link.getBoundingClientRect();

                const x =
                    event.clientX -
                    rect.left;

                const y =
                    event.clientY -
                    rect.top;

                const rotateY =
                    (x / rect.width - .5) * 2;

                const rotateX =
                    (.5 - y / rect.height) * 2;

                link.style.transform =
                    `
                    translateY(-4px)
                    perspective(600px)
                    rotateX(${rotateX}deg)
                    rotateY(${rotateY}deg)
                    scale(1.008)
                    `;

            }
        );

        link.addEventListener(
            "mouseleave",
            ()=>{

                link.style.transform="";

            }
        );

    });

}


/* =========================================
   RANDOM PARTICLE EFFECT
========================================= */

function createParticle(){

    const particle =
        document.createElement("span");

    particle.style.position="fixed";
    particle.style.width="2px";
    particle.style.height="2px";
    particle.style.borderRadius="50%";
    particle.style.background="#d91b28";
    particle.style.opacity=
        Math.random()*.25;

    particle.style.left=
        Math.random()*100+"vw";

    particle.style.top=
        Math.random()*100+"vh";

    particle.style.pointerEvents="none";
    particle.style.zIndex="-1";

    document.body.appendChild(particle);

    const duration =
        5000 + Math.random()*7000;

    particle.animate(

        [
            {
                transform:"translateY(0)",
                opacity:0
            },
            {
                transform:
                    `translateY(-${80+Math.random()*100}px)`,
                opacity:.3
            },
            {
                transform:
                    `translateY(-${160+Math.random()*160}px)`,
                opacity:0
            }
        ],

        {
            duration,
            easing:"ease-out"
        }

    ).finished.then(()=>{
        particle.remove();
    });

}

setInterval(
    createParticle,
    650
);
